# Example Apache 2.4.47+ virtual host (mod_proxy_http, mod_headers, mod_ssl).
# The WebSocket upgrade goes through mod_proxy_http itself: no mod_proxy_wstunnel.
<VirtualHost *:443>
    ServerName radar-hub.example.com

    ProxyPreserveHost On
    # Keepalive pings every 30 s keep the tunnel busy, well under this idle timeout.
    ProxyPass        /ws http://127.0.0.1:8795/ws upgrade=websocket timeout=300
    ProxyPass        /   http://127.0.0.1:8795/
    ProxyPassReverse /   http://127.0.0.1:8795/

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Robots-Tag "noindex, nofollow"

    # The hub keeps no IP address; neither should the access log for radar connections.
    SetEnvIf Request_URI "^/ws" radar_hub_nolog
    CustomLog ${APACHE_LOG_DIR}/radar-hub-access.log combined env=!radar_hub_nolog
    ErrorLog ${APACHE_LOG_DIR}/radar-hub-error.log

    SSLCertificateFile    /etc/letsencrypt/live/radar-hub.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/radar-hub.example.com/privkey.pem
</VirtualHost>
